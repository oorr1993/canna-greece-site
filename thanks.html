<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפנייה התקבלה | קנאגריס</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Rubik+Bubbles&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rubik', sans-serif; color: #26325E;
  background:
    linear-gradient(#D9D4F2 1px, transparent 1px),
    linear-gradient(90deg, #D9D4F2 1px, transparent 1px),
    #EEEEFF;
  background-size: 44px 44px, 44px 44px, auto;
  min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
}
.card {
  background: #fff; border: 2px solid #000; border-radius: 20px;
  box-shadow: 6px 6px 0 #000; padding: 46px 36px; max-width: 520px;
}
h1 {
  font-family: 'Rubik Bubbles', 'Rubik', sans-serif; font-weight: 400;
  font-size: clamp(38px, 8vw, 56px); color: #4D4ED9;
  -webkit-text-stroke: 1.5px #000; paint-order: stroke fill;
  text-shadow: 4px 4px 0 #000; margin-bottom: 14px;
}
p { font-size: 17px; margin-bottom: 12px; }
.stamp {
  display: inline-block; background: #08D19A; border: 2px solid #000; border-radius: 999px;
  box-shadow: 3px 3px 0 #000; padding: 6px 22px; font-weight: 900; font-size: 15px;
  transform: rotate(-2deg); margin-bottom: 20px;
}
a {
  display: inline-block; margin-top: 16px; background: #4D4ED9; color: #fff; text-decoration: none;
  border: 2px solid #000; border-radius: 12px; box-shadow: 4px 4px 0 #000;
  padding: 13px 30px; font-weight: 700; font-size: 16px;
}
</style>
</head>
<body>
<div class="card">
  <span class="stamp">התקבל ✓</span>
  <h1>הפנייה אצלנו!</h1>
  <p>תודה! השאלון שלכם נשלח לבדיקה.</p>
  <p>בשעות הפעילות, תשובת הרופא מגיעה בדרך כלל <b>תוך כשעה</b> — למייל ולוואטסאפ שהשארתם. שווה לפקוח עין גם על תיקיית הספאם.</p>
  <a href="/">חזרה לדף הבית</a>
</div>
</body>
</html>
